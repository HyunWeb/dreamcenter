name: Deploy to EC2 (Dockerized)

on:
  push:
    branches:
      - main # main 브랜치에 push될 때만 작동

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code # GitHub 저장소의 코드를 GitHub Actions 런너에 클론하여 작업 시작
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH # 진짜 배포 동작을 수행
        uses: appleboy/ssh-action@master
        timeout-minutes: 60
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |


            set -e  # 스크립트 에러 발생 시 즉시 종료

            cd /home/ubuntu/dreamcenter

            git pull origin main

            cd backend

            # 1) 기존 컨테이너를 켜 둔 채 새 이미지를 먼저 빌드한다.
            #    (예전에는 down 후 빌드해서 빌드 시간 약 2분 동안 사이트가 꺼져 있었다.
            #     빌드가 실패해도 기존 사이트는 그대로 유지된다.)
            docker-compose build

            # 2) 바뀐 컨테이너만 새 이미지로 교체한다. DB(mysql)는 바뀐 게 없으면 재시작하지 않는다.
            echo "교체 시작: $(date -u +%H:%M:%S)"
            docker-compose up -d
            echo "교체 완료: $(date -u +%H:%M:%S)"

            # 3) 교체되고 남은 옛 이미지(dangling)만 정리해 디스크가 차지 않게 한다.
            docker image prune -f

            docker system df

            echo "✅ 모든 작업 완료"
            exit 0
